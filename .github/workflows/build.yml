name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested image to GHCR (main only)
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
concurrency:
  group: watermeter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build production image and smoke binaries
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: final
          platforms: linux/amd64
          load: true
          tags: watermeter:local
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,scope=production,mode=max
      - name: Build isolated test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: test
          platforms: linux/amd64
          load: true
          tags: watermeter:test
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=tests
          cache-to: type=gha,scope=tests,mode=max
      - name: Run settings, security, lifecycle, offline-negative and real broker tests
        run: docker run --rm --network none --tmpfs /run/watermeter:mode=0700 watermeter:test
      - name: Validate all Compose combinations without creating secret files
        run: |
          docker compose config --quiet
          MQTT_HOST=broker.invalid docker compose -f compose.yaml -f compose.mqtt.yaml config --quiet
          MQTT_HOST=broker.invalid docker compose -f compose.yaml -f compose.mqtt.yaml -f compose.mqtt.auth.yaml config --quiet
      - name: Optional trusted runtime fixture decryption
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          METER_AES_KEY: ${{ secrets.METER_AES_KEY }}
        run: |
          if [ -z "$METER_AES_KEY" ]; then
            echo 'SKIP: optional runtime AES secret is not configured'
          else
            ./scripts/test-offline.sh
          fi
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: final
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=production
