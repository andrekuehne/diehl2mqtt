name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested image to GHCR (main only; pushes publish automatically)
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
concurrency:
  group: watermeter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release tag and main ancestry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Test Proxmox host installer without host mutations
        run: python3 -m unittest discover -s tests/proxmox -v
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build production image and smoke binaries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: final
          platforms: linux/amd64
          load: true
          tags: watermeter:local
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,scope=production,mode=max
      - name: Build isolated test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          platforms: linux/amd64
          load: true
          tags: watermeter:test
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=tests
          cache-to: type=gha,scope=tests,mode=max
      - name: Build Home Assistant add-on image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ha-addon
          platforms: linux/amd64
          load: true
          tags: watermeter:ha-addon
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,scope=addon,mode=max
      - name: Run settings, security, lifecycle, offline-negative and real broker tests
        run: docker run --rm --network none --tmpfs /run/watermeter:mode=0700 watermeter:test
      - name: Verify installed native LXC application layout
        run: |
          docker run --rm --network none --entrypoint /usr/bin/python3 --mount type=bind,src="$PWD/scripts/install-proxmox.py",dst=/tmp/install-proxmox.py,readonly --mount type=bind,src="$PWD/scripts/test-lxc-layout.py",dst=/tmp/test-lxc-layout.py,readonly watermeter:local /tmp/test-lxc-layout.py
      - name: Verify Home Assistant manifest and actual add-on startup/recovery
        run: |
          python3 -m pip install PyYAML
          python3 scripts/check-addon.py
          docker run --rm --network none --tmpfs /tmp --entrypoint python --mount type=bind,src="$PWD/scripts/test-ha-addon.py",dst=/test-ha-addon.py,readonly watermeter:ha-addon /test-ha-addon.py
      - name: Test enforced AppArmor and non-root runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apparmor
          python3 scripts/test-apparmor.py
      - name: Prepare vulnerability reports
        run: mkdir -p "$RUNNER_TEMP/security"
      - name: Scan standalone image (all vulnerability severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: watermeter:local
          scanners: vuln
          format: json
          output: ${{ runner.temp }}/security/standalone.json
          exit-code: '0'
          timeout: 10m
      - name: Scan Home Assistant image (all vulnerability severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: watermeter:ha-addon
          scanners: vuln
          format: json
          output: ${{ runner.temp }}/security/home-assistant.json
          exit-code: '0'
          skip-setup-trivy: true
          timeout: 10m
      - name: Block publication on fixable high or critical vulnerabilities
        run: |
          for image in watermeter:local watermeter:ha-addon; do
            trivy image --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" --image-src docker --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --timeout 10m "$image"
          done
      - name: Save vulnerability reports including unfixed findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-vulnerability-reports
          path: ${{ runner.temp }}/security/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify OCI archive conversion for direct Proxmox LXC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
          skopeo copy docker-daemon:watermeter:local "oci-archive:$RUNNER_TEMP/diehl2mqtt-oci.tar"
          skopeo inspect --config "oci-archive:$RUNNER_TEMP/diehl2mqtt-oci.tar" | python3 -c 'import json,sys; c=json.load(sys.stdin); assert c["architecture"] == "amd64" and c["os"] == "linux"; assert c["config"]["Entrypoint"] == ["/usr/bin/tini", "-g", "--", "/usr/local/bin/entrypoint.sh"]; assert c["config"]["Cmd"] == ["live"]; assert "PYTHONPATH=/opt/watermeter" in c["config"]["Env"]; print("PASS: OCI archive preserves platform, startup command and environment")'
      - name: Validate all Compose combinations without creating secret files
        run: |
          docker compose config --quiet
          MQTT_HOST=broker.invalid docker compose -f compose.yaml -f compose.mqtt.yaml config --quiet
          MQTT_HOST=broker.invalid METER_ID=12345678 docker compose -f compose.yaml -f compose.mqtt.yaml -f compose.mqtt.auth.yaml config --quiet
      - name: Save the tested production image
        if: github.event_name != 'pull_request'
        run: |
          docker save watermeter:local -o "$RUNNER_TEMP/watermeter-image.tar"
          docker save watermeter:ha-addon -o "$RUNNER_TEMP/watermeter-addon-image.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: tested-amd64-image
          path: |
            ${{ runner.temp }}/watermeter-image.tar
            ${{ runner.temp }}/watermeter-addon-image.tar
          retention-days: 2
      - name: Decode public synthetic fixture
        run: ./scripts/test-offline.sh
  publish:
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) ||
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-amd64-image
          path: ${{ runner.temp }}
      - name: Load the tested production image
        run: |
          docker load -i "$RUNNER_TEMP/watermeter-image.tar"
          docker load -i "$RUNNER_TEMP/watermeter-addon-image.tar"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact tested image
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          tags=("sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tags+=("$GITHUB_REF_NAME")
          else
            tags+=(latest)
          fi
          for tag in "${tags[@]}"; do
            docker tag watermeter:local "$image:$tag"
            docker push "$image:$tag"
          done
          digest=$(docker image inspect "$image:${tags[0]}" --format '{{index .RepoDigests 0}}')
          [[ "$digest" == "$image@sha256:"* ]]
          echo "reference=$digest" >> "$GITHUB_OUTPUT"
          echo "Published amd64 image: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish exact tested Home Assistant image
        id: addon_image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          tag="ha-sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag watermeter:ha-addon "$image:$tag"
          docker push "$image:$tag"
          digest=$(docker image inspect "$image:$tag" --format '{{index .RepoDigests 0}}')
          [[ "$digest" == "$image@sha256:"* ]]
          echo "reference=$digest" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # The add-on uses plain semver; standalone Docker uses v-prefixed tags.
            tag="${GITHUB_REF_NAME#v}"
            expected=$(docker image inspect watermeter:ha-addon --format '{{index .Config.Labels "io.hass.version"}}')
            [[ "$tag" == "$expected" ]]
            docker tag watermeter:ha-addon "$image:$tag"
            docker push "$image:$tag"
          else
            docker tag watermeter:ha-addon "$image:ha-latest"
            docker push "$image:ha-latest"
          fi
      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
      - name: Sign and verify both exact image digests using GitHub OIDC
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
          ADDON_IMAGE: ${{ steps.addon_image.outputs.reference }}
          REPOSITORY: ${{ github.repository }}
        run: |
          identity="https://github.com/$REPOSITORY/.github/workflows/build.yml@$GITHUB_REF"
          for image in "$IMAGE" "$ADDON_IMAGE"; do
            cosign sign --yes "$image"
            cosign verify --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$image"
          done
      - name: Package versioned deployment and native sources
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          docker run --rm --network none --entrypoint cat watermeter:local /usr/share/watermeter/packages.txt > "$RUNNER_TEMP/packages.txt"
          docker run --rm --network none --entrypoint /usr/bin/python3 --mount type=bind,src="$PWD/scripts/package-app.py",dst=/tmp/package-app.py,readonly watermeter:local /tmp/package-app.py --version "$GITHUB_REF_NAME" --image "$IMAGE" > "$RUNNER_TEMP/app.tar.gz"
          python3 scripts/package-release.py --version "$GITHUB_REF_NAME" --image "$IMAGE" --packages-file "$RUNNER_TEMP/packages.txt" --app-bundle "$RUNNER_TEMP/app.tar.gz" --output "$RUNNER_TEMP/release"
          tar -xzf "$RUNNER_TEMP/release/diehl2mqtt-$GITHUB_REF_NAME-deploy.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/diehl2mqtt-$GITHUB_REF_NAME"
          cp .env.example .env
          if METER_ID= MQTT_HOST=broker.invalid docker compose -f compose.yaml -f compose.mqtt.yaml -f compose.mqtt.auth.yaml config --quiet 2>/dev/null; then
            echo 'Deployment must require an explicit meter ID'
            exit 1
          fi
          METER_ID=00123456 MQTT_HOST=broker.invalid docker compose -f compose.yaml -f compose.mqtt.yaml -f compose.mqtt.auth.yaml config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]["watermeter"]; assert "build" not in s; assert s["environment"]["METER_ID"] == "00123456"; print("PASS: build-free deployment preserves leading zeros and requires a meter ID")'
      - name: Sign and verify release checksums
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          checksums="$RUNNER_TEMP/release/SHA256SUMS"
          identity="https://github.com/$REPOSITORY/.github/workflows/build.yml@$GITHUB_REF"
          cosign sign-blob --yes --bundle "$checksums.sigstore.json" "$checksums"
          cosign verify-blob --bundle "$checksums.sigstore.json" --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$checksums"
      - name: Create versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          printf 'Linux amd64 release. Download the deployment archive, extract it and follow its README.\n\nImage: `%s`\n\nNative source/build materials and SHA256 checksums are attached. Runtime secrets are created only on your host.\n' "$IMAGE" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/release/"* --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release/"* --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
